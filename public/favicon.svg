<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Pnyxy mark for the favicon. Solid fill + fill-rule="evenodd" so the
    cutout is a real hole, not a dark-coloured patch. Earlier versions
    used a <linearGradient> for the P; Google's favicon rasteriser
    silently dropped the gradient reference, leaving fill=none on the
    outer path and exposing only the inner cutout against Google's
    white results-row background ("white circle, tiny black triangle"
    report). A flat colour avoids that whole class of crawler bug.
    The home-screen PNGs and the boot splash keep the gradient — they
    render through real SVG/raster paths where it works fine.
  -->
  <path
    fill-rule="evenodd"
    fill="#64FFDA"
    d="M205 898V307V127H576.917C910.573 127 888.629 646 576.917 646H398.554V898H205Z
       M564 402H205V574L564 402Z"
  />
</svg>
