project_id = "pnyxy-reader"

[functions.ai-chat-proxy]
verify_jwt = false

# Lemon Squeezy calls this with its own HMAC signature, not a user JWT.
[functions.lemonsqueezy-webhook]
verify_jwt = false

# Stripe calls this with its own signature (Stripe-Signature), not a user JWT.
[functions.stripe-webhook]
verify_jwt = false

# stripe-checkout is called by a signed-in user; keep the gateway's JWT
# check (default) — the function re-reads the JWT to get the user id.
[functions.stripe-checkout]
verify_jwt = true

# stripe-portal (manage/cancel subscription) — same as stripe-checkout.
[functions.stripe-portal]
verify_jwt = true

[functions.ingest-url]
verify_jwt = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/welcome",
  "http://localhost:5173/auth/reset-password",
  "http://localhost:5173/library",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true

[auth.email.template.confirmation]
subject       = "Welcome to Pnyxy — confirm your email"
content_path  = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject       = "Reset your Pnyxy password"
content_path  = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject       = "Your Pnyxy magic link"
content_path  = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject       = "Confirm your new Pnyxy email"
content_path  = "./supabase/templates/email_change.html"

[auth.external.google]
enabled      = true
client_id    = "env(GOOGLE_CLIENT_ID)"
secret       = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""
