project_id = "pnyxy-reader"

[functions.ai-chat-proxy]
verify_jwt = false

# send-feedback allows anonymous senders (rate limited by hashed IP + a global
# daily cap), so the gateway JWT check is off; the function still attributes a
# signed-in user from the JWT when one is present.
[functions.send-feedback]
verify_jwt = false

# Stripe calls this with its own signature (Stripe-Signature), not a user JWT.
[functions.stripe-webhook]
verify_jwt = false

# stripe-checkout is called by a signed-in user; keep the gateway's JWT
# check (default), the function re-reads the JWT to get the user id.
[functions.stripe-checkout]
verify_jwt = true

# stripe-portal (manage/cancel subscription), same as stripe-checkout.
[functions.stripe-portal]
verify_jwt = true

[functions.ingest-url]
verify_jwt = true

# delete-account permanently erases the caller's own account (GDPR
# self-service deletion); requires a verified user JWT, same as
# stripe-checkout/stripe-portal.
[functions.delete-account]
verify_jwt = true

[functions.mcp]
# The function answers unauthenticated calls itself (401 + the OAuth
# discovery challenge) and validates the bearer token on its own.
verify_jwt = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/welcome",
  "http://localhost:5173/auth/reset-password",
  "http://localhost:5173/library",
]
jwt_expiry = 3600
enable_signup = true

# OAuth 2.1 server, so AI agents (claude.ai connectors, ChatGPT) can sign
# users in for the remote MCP function. The consent UI is the app's
# /oauth/consent route (site_url + authorization_url_path). Local only: the
# hosted project is configured in the dashboard (Authentication > OAuth Server).
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true

[auth.email.template.confirmation]
subject       = "Welcome to Pnyxy: confirm your email"
content_path  = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject       = "Reset your Pnyxy password"
content_path  = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject       = "Your Pnyxy magic link"
content_path  = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject       = "Confirm your new Pnyxy email"
content_path  = "./supabase/templates/email_change.html"

[auth.external.google]
enabled      = false
client_id    = "env(GOOGLE_CLIENT_ID)"
secret       = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""
