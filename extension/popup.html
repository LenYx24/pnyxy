<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark" />
<title>Pnyxy</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <span class="popup-mark" aria-hidden="true"></span>
      <span class="popup-title">Pnyxy</span>
    </header>

    <p class="page-title" id="pageTitle"></p>

    <textarea
      id="selectionText"
      class="selection-box"
      rows="5"
      placeholder="Selected text on the page appears here. Edit it, or leave empty to ask about the page as a whole."
    ></textarea>

    <div class="actions">
      <button id="askBtn" class="btn btn-primary" type="button">Ask Pnyxy</button>
      <button id="saveBtn" class="btn btn-secondary" type="button">Save page</button>
    </div>

    <details class="settings">
      <summary>Settings</summary>
      <label class="settings-row" for="appUrl">
        <span>App URL</span>
        <input id="appUrl" type="text" placeholder="https://pnyxy.com" autocomplete="off" spellcheck="false" />
      </label>
      <div class="settings-actions">
        <button id="saveSettingsBtn" class="btn btn-ghost" type="button">Save</button>
        <span id="settingsStatus" class="settings-status" role="status"></span>
      </div>
    </details>
  </div>
  <script src="popup.js"></script>
</body>
</html>
