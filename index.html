    <script>
      // Password-reset hand-off. Supabase recovery emails put the
      // tokens in the URL hash and redirect to whatever Site URL +
      // allowed-redirect config the project has — not always
      // /auth/reset-password. If the user lands anywhere else with a
      // `type=recovery` hash, the auto-session-from-URL would sign
      // them in to a normal session and they'd skip the
      // change-password form entirely. Catch it here, BEFORE the
      // module bundle runs (and before the Supabase client consumes
      // the hash), and redirect to /auth/reset-password with the hash
      // preserved so the SDK still creates the recovery session on
      // the correct page. Plain JS — no imports — so this runs before
      // anything else.
      (function () {
        try {
          var h = window.location.hash || "";
          if (
            h.indexOf("type=recovery") !== -1 &&
            window.location.pathname !== "/auth/reset-password"
          ) {
            window.location.replace(
              "/auth/reset-password" + window.location.search + h,
            );
          }
        } catch (_e) {
          // best-effort; if anything throws we fall through to the
          // normal auth flow and the user lands wherever the email
          // sent them.
        }
      })();
    </script>
