name: Release desktop builds

# Fire when a version tag is pushed. Use semantic versions like v0.1.0.
# Nothing happens on branch pushes or PRs: releases are explicit.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: AppImage + .deb (runs on Ubuntu 22.04 for glibc
          # compatibility with older distros).
          - platform: ubuntu-22.04
            args: ""
            target_desc: linux
          # macOS universal binary (Intel + Apple Silicon in one .dmg).
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            target_desc: macos
          # Windows: .msi + .exe installer.
          - platform: windows-latest
            args: ""
            target_desc: windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # ── Node + pnpm ────────────────────────────────────────
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ── Rust toolchain (Tauri needs it on the build host) ──
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal build needs both targets; everywhere else the
          # default host target is fine.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}

      # ── Linux-only system deps for Tauri (webkit, glib, etc.) ──
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # ── Frontend deps ──────────────────────────────────────
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ── Tauri build + draft release upload ─────────────────
      # tauri-action compiles the app, creates (or reuses) a draft
      # GitHub Release tagged with the pushed tag, and uploads the
      # platform-specific installer(s) to it.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Vite frontend needs these at build time. Reuse the same
          # secret names as the Cloudflare deploy workflow.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          # Pin the release to the pushed tag so re-running doesn't
          # create duplicate drafts.
          tagName: ${{ github.ref_name }}
          releaseName: "Pnyxy ${{ github.ref_name }}"
          releaseBody: |
            Desktop builds for Pnyxy ${{ github.ref_name }}.

            **Windows**: download the `.msi` or `.exe` installer below.
            **macOS**: download the `.dmg` (universal: works on Intel and Apple Silicon).
            **Linux**: download the `.AppImage` (portable) or `.deb` (Debian/Ubuntu).

            ⚠ These builds are **not code-signed**. Your OS may warn before running,
            this is expected for unsigned open-source software.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
